services:
  api:
    environment:
        API_PORT: ${API_PORT}
        MODEL_PATH: ${MODEL_PATH}
    build:
        context: .
        dockerfile: ./api/Dockerfile
    ports:
      - "${API_PORT}:${API_PORT}"
    image: yragax/prod-devops-learning:api-${TAG:-latest}
  demo:
    environment:
        API_PORT: ${API_PORT}
        DEMO_PORT: ${DEMO_PORT}
    build:
        context: .
        dockerfile: ./demo/Dockerfile
    ports:
      - "${DEMO_PORT}:${DEMO_PORT}"
    depends_on:
      - api
    image: yragax/prod-devops-learning:demo-${TAG:-latest}
