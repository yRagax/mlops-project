name: Python CD

on:
  push:
    branches:
      - main

jobs:
  cd:
    runs-on: ubuntu-latest

    env:
      MLFLOW_URI: ${{ vars.MLFLOW_URI }}
      API_PORT: ${{ vars.API_PORT }}
      DEMO_PORT: ${{ vars.DEMO_PORT }}
      MODEL_PATH: ${{ vars.MODEL_PATH }}
      TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images
        run: docker compose build

      - name: Push images to Docker Hub
        run: docker compose push

      - name: Update latest tags
        run: |
          docker tag yragax/prod-devops-learning:api-${{ github.sha }} yragax/prod-devops-learning:api-latest
          docker tag yragax/prod-devops-learning:demo-${{ github.sha }} yragax/prod-devops-learning:demo-latest
          docker push yragax/prod-devops-learning:api-latest
          docker push yragax/prod-devops-learning:demo-latest
