name: Python CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  cd:
    runs-on: ubuntu-latest

    env:
      MLFLOW_URI: ${{ vars.MLFLOW_URI }}
      API_PORT: ${{ vars.API_PORT }}
      DEMO_PORT: ${{ vars.DEMO_PORT }}
      MODEL_PATH: ${{ vars.MODEL_PATH }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      AUDIENCE: ${{ vars.AUDIENCE }}
      TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        id: aws-creds-oidc
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GH_ACTIONS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (Local Development)
        if: steps.aws-creds-oidc.outcome == 'failure'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: ${AUDIENCE}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        run: docker compose build

      - name: Push images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker compose push

      - name: Update latest tags
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag ${ECR_REGISTRY}/${ECR_REPOSITORY}:api-${TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:api-latest
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:api-latest
          docker tag ${ECR_REGISTRY}/${ECR_REPOSITORY}:demo-${TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:demo-latest
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:demo-latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Update infrastructure
        run: |
          terraform -chdir=terraform init
          terraform -chdir=terraform apply -auto-approve \
            -var "api_container_port=${API_PORT}" \
            -var "demo_container_port=${DEMO_PORT}" \
            -var "model_path=${MODEL_PATH}"
